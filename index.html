<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Retro Consolas – Top Games PAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #7c3aed;
      --accent-2: #22d3ee;
      --border: #2b303b;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
      --md: #f59e0b;
      --snes: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 24px 16px 8px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(124,58,237,0.08), transparent);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 0.2px;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      max-width: 900px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: #0b0d12;
      position: sticky;
      top: 0;
      z-index: 6;
    }
    .tab {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }
    .tab.active {
      border-color: var(--accent);
      background: #1f2330;
      color: #fff;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: #0b0d12;
      position: sticky;
      top: 56px;
      z-index: 5;
    }
    .controls input, .controls select, .controls button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }
    .controls input { min-width: 220px; flex: 1 1 220px; }
    .controls select { min-width: 160px; }
    .controls button {
      cursor: pointer;
      border-color: #3b4150;
    }
    .container {
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 180px;
    }
    .card h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #222633;
      border: 1px solid #2f3542;
      font-size: 11px;
      color: #cfd4df;
    }
    .score {
      margin-left: auto;
      font-weight: 700;
      font-size: 13px;
    }
    .score.md { color: var(--md); }
    .score.snes { color: var(--accent-2); }
    .desc {
      font-size: 12px;
      color: #c9ced6;
      line-height: 1.35;
      flex: 1 1 auto;
    }
    .reason {
      font-size: 11px;
      color: #9aa3b2;
      border-top: 1px dashed #2a3040;
      padding-top: 6px;
      margin-top: 4px;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 10px;
      font-size: 14px;
    }
    .status-bar {
      font-size: 12px;
      color: var(--muted);
      padding: 6px 16px;
      border-top: 1px solid var(--border);
      background: #0b0d12;
    }
    .console-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #2f3542;
      background: #222633;
      color: #cfd4df;
      margin-left: 6px;
    }
    .console-badge.md { color: var(--md); }
    .console-badge.snes { color: var(--accent-2); }
  </style>
</head>
<body>
  <header>
    <h1>Retro Consolas – Top Games PAL</h1>
    <div class="sub">
      CatÃ¡logo consolidado de juegos PAL de Mega Drive y Super Nintendo.
      Los datos se cargan desde <code>megadrive_scoring.csv</code> y <code>snes_scoring.csv</code>.
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-console="md">Mega Drive</div>
    <div class="tab" data-console="snes">Super Nintendo</div>
  </div>

  <div class="controls">
    <input id="searchInput" type="text" placeholder="Buscar por tÃ¬tulo, gÃ©nero, descripciÃ³nâ¦» />
    <select id="genreFilter">
      <option value="">Todos los gÃ©neros</option>
    </select>
    <select id="sortSelect">
      <option value="total_desc">Orden: PuntuaciÃ³n (mayor a menor)</option>
      <option value="total_asc">Orden: PuntuaciÃ³n (menor a mayor)</option>
      <option value="released_asc">Orden: Lanzamiento (antiguo â reciente)</option>
      <option value="released_desc">Orden: Lanzamiento (reciente â antiguo)</option>
      <option value="title_asc">Orden: TÃ¬tulo (A â Z)</option>
      <option value="title_desc">Orden: TÃ¬tulo (Z â A)</option>
    </select>
    <button id="resetBtn">Resetear filtros</button>
  </div>

  <div class="container">
    <div id="grid" class="grid"></div>
    <div id="emptyState" class="empty" style="display:none">
      No se encontraron juegos con estos filtros.
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    Cargando datosâ¦»
  </div>

  <script>
    // Rutas de los CSV (deben estar en la misma carpeta que este HTML)
    const MD_CSV = "megadrive_scoring.csv";
    const SNES_CSV = "snes_scoring.csv";

    const grid = document.getElementById("grid");
    const emptyState = document.getElementById("emptyState");
    const statusBar = document.getElementById("statusBar");
    const searchInput = document.getElementById("searchInput");
    const genreFilter = document.getElementById("genreFilter");
    const sortSelect = document.getElementById("sortSelect");
    const resetBtn = document.getElementById("resetBtn");
    const tabs = document.querySelectorAll(".tab");

    let mdRows = [];
    let snesRows = [];
    let currentConsole = "md"; // 'md' o 'snes'
    let allGenres = new Set();

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
      if (lines.length === 0) return [];
      const header = splitCSVLine(lines[0], ";");
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cells = splitCSVLine(lines[i], ";");
        if (cells.length < header.length) continue;
        const obj = {};
        for (let j = 0; j < header.length; j++) {
          const key = header[j].trim();
          obj[key] = (cells[j] ?? "").trim();
        }
        rows.push(obj);
      }
      return rows;
    }

    function splitCSVLine(line, sep = ";") {
      const result = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === sep && !inQuotes) {
          result.push(cur);
          cur = "";
        } else {
          cur += ch;
        }
      }
      result.push(cur);
      return result;
    }

    function normalizeRow(row, consoleType) {
      // Adapta las claves segÃºn tu CSV real
      const title =
        row["canonical_pal_title"] ||
        row["title"] ||
        "";
      const released = row["released"] || "";
      const genre = row["genre"] || "";
      const total = parseFloat(row["total_pal"] || row["total"] || "0");
      const graphics = parseFloat(row["graphics_pal"] || row["graphics"] || "0");
      const music = parseFloat(row["music_pal"] || row["music"] || "0");
      const gameplay = parseFloat(row["gameplay_pal"] || row["gameplay"] || "0");
      const notes = row["notes_pal_ntsc_j"] || row["notes"] || "";
      const variants = row["name_variants"] || "";
      const reasoning = row["score_reasoning"] || "";
      const desc = row["description_es"] || row["description"] || "";

      return {
        console: consoleType,
        title,
        released,
        genre,
        total,
        graphics,
        music,
        gameplay,
        notes,
        variants,
        reasoning,
        desc,
        raw: row
      };
    }

    function renderGenres() {
      const opts = [""];
      const sorted = Array.from(allGenres).sort((a, b) => a.localeCompare(b));
      for (const g of sorted) {
        if (!g) continue;
        opts.push(g);
      }
      genreFilter.innerHTML = opts
        .map(g => `<option value="${g}">${g || "Todos los gÃ©neros"}</option>`)
        .join("");
    }

    function getCurrentRows() {
      return currentConsole === "md" ? mdRows : snesRows;
    }

    function applyFiltersAndSort() {
      const rows = getCurrentRows();
      const q = searchInput.value.toLowerCase();
      const g = genreFilter.value;
      const sort = sortSelect.value;

      let filtered = rows.filter(r => {
        const inGenre = !g || r.genre === g;
        const text =
          (r.title + " " + r.genre + " " + r.desc + " " + r.notes + " " + r.variants).toLowerCase();
        const inSearch = !q || text.includes(q);
        return inGenre && inSearch;
      });

      switch (sort) {
        case "total_asc":
          filtered.sort((a, b) => a.total - b.total || a.title.localeCompare(b.title));
          break;
        case "total_desc":
          filtered.sort((a, b) => b.total - a.total || a.title.localeCompare(b.title));
          break;
        case "released_asc":
          filtered.sort((a, b) => (a.released || "").localeCompare(b.released || "") || a.title.localeCompare(b.title));
          break;
        case "released_desc":
          filtered.sort((a, b) => (b.released || "").localeCompare(a.released || "") || a.title.localeCompare(b.title));
          break;
        case "title_asc":
          filtered.sort((a, b) => a.title.localeCompare(b.title));
          break;
        case "title_desc":
          filtered.sort((a, b) => b.title.localeCompare(a.title));
          break;
      }

      renderGrid(filtered);
    }

    function renderGrid(rows) {
      grid.innerHTML = "";
      if (rows.length === 0) {
        emptyState.style.display = "block";
        const label = currentConsole === "md" ? "Mega Drive" : "Super Nintendo";
        statusBar.textContent = `${label}: 0 juegos mostrados.`;
        return;
      }
      emptyState.style.display = "none";
      const label = currentConsole === "md" ? "Mega Drive" : "Super Nintendo";
      statusBar.textContent = `${label}: ${rows.length} juegos mostrados de ${rows.length}.`;

      const frag = document.createDocumentFragment();
      for (const r of rows) {
        const card = document.createElement("div");
        card.className = "card";

        const head = document.createElement("div");
        head.style.display = "flex";
        head.style.alignItems = "center";
        head.style.gap = "6px";

        const h3 = document.createElement("h3");
        h3.textContent = r.title || "(sin tÃ¬tulo)";
        head.appendChild(h3);

        const score = document.createElement("div");
        score.className = "score " + (r.console === "md" ? "md" : "snes");
        score.textContent = `PAL ${Number.isFinite(r.total) ? r.total.toFixed(1) : "0.0"}`;
        head.appendChild(score);

        const consoleBadge = document.createElement("span");
        consoleBadge.className = "console-badge " + (r.console === "md" ? "md" : "snes");
        consoleBadge.textContent = r.console === "md" ? "Mega Drive" : "SNES";
        head.appendChild(consoleBadge);

        const meta = document.createElement("div");
        meta.className = "meta";
        if (r.released) {
          const year = (r.released || "").slice(0, 4);
          if (year && year.length === 4) {
            const y = document.createElement("span");
            y.className = "pill";
            y.textContent = year;
            meta.appendChild(y);
          }
        }
        if (r.genre) {
          const g = document.createElement("span");
          g.className = "pill";
          g.textContent = r.genre;
          meta.appendChild(g);
        }
        if (r.notes) {
          const n = document.createElement("span");
          n.className = "pill";
          n.textContent = "PAL/NTSC-J";
          n.title = r.notes;
          meta.appendChild(n);
        }

        const desc = document.createElement("div");
        desc.className = "desc";
        desc.textContent = r.desc || "";

        const reason = document.createElement("div");
        reason.className = "reason";
        reason.textContent = r.reasoning || "";

        card.appendChild(head);
        card.appendChild(meta);
        card.appendChild(desc);
        card.appendChild(reason);
        frag.appendChild(card);
      }
      grid.appendChild(frag);
    }

    async function loadConsoleData() {
      statusBar.textContent = "Cargando datos de Mega Drive y Super Nintendoâ¦»";

      const [mdRes, snesRes] = await Promise.allSettled([
        fetch(MD_CSV).then(r => {
          if (!r.ok) throw new Error("MD HTTP " + r.status);
          return r.text();
        }),
        fetch(SNES_CSV).then(r => {
          if (!r.ok) throw new Error("SNES HTTP " + r.status);
          return r.text();
        })
      ]);

      if (mdRes.status === "fulfilled") {
        const raw = parseCSV(mdRes.value);
        mdRows = raw.map(r => normalizeRow(r, "md")).filter(r => r.title);
        for (const r of mdRows) {
          if (r.genre) allGenres.add(r.genre);
        }
      } else {
        console.warn("Error cargando Mega Drive:", mdRes.reason);
        mdRows = [];
      }

      if (snesRes.status === "fulfilled") {
        const raw = parseCSV(snesRes.value);
        snesRows = raw.map(r => normalizeRow(r, "snes")).filter(r => r.title);
        for (const r of snesRows) {
          if (r.genre) allGenres.add(r.genre);
        }
      } else {
        console.warn("Error cargando Super Nintendo:", snesRes.reason);
        snesRows = [];
      }

      renderGenres();
      applyFiltersAndSort();
    }

    function switchConsole(consoleType) {
      currentConsole = consoleType;
      tabs.forEach(t => {
        t.classList.toggle("active", t.dataset.console === consoleType);
      });
      // Resetear filtros al cambiar de consola (opcional)
      searchInput.value = "";
      genreFilter.value = "";
      sortSelect.value = "total_desc";
      applyFiltersAndSort();
    }

    tabs.forEach(t => {
      t.addEventListener("click", () => switchConsole(t.dataset.console));
    });

    searchInput.addEventListener("input", applyFiltersAndSort);
    genreFilter.addEventListener("change", applyFiltersAndSort);
    sortSelect.addEventListener("change", applyFiltersAndSort);
    resetBtn.addEventListener("click", () => {
      searchInput.value = "";
      genreFilter.value = "";
      sortSelect.value = "total_desc";
      applyFiltersAndSort();
    });

    loadConsoleData();
  </script>
</body>
</html>
